services:
  app:
    build:
      context: .
      network: host
    network_mode: host
    image: daily-relay-app
    env_file: .env
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./public:/app/public
      - ./src:/app/src
      - ./tests:/app/tests
      - ./sources.yaml:/app/sources.yaml
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./package.json:/app/package.json.host:ro
      - ./package-lock.json:/app/package-lock.json.host:ro
      - ./Dockerfile:/app/Dockerfile.host:ro
      - ./entrypoint.sh:/app/entrypoint.sh.host:ro
      # This anonymous volume ensures container-built modules aren't overwritten by host files
      - /app/node_modules
    restart: always
