  - name: "Google Tasks"
    type: "tasks"
  - name: "GitHub Releases"
    type: "github"
    repos:
      - "cjpais/Handy"
      - "yaml/yamlscript"
      - "windmill-labs/windmill"
      - "custom-components/healthchecksio"
      - "oven-sh/bun"
      - "ohmyzsh/ohmyzsh"
      - "alpinejs/alpine"
      - "rails/rails"
      - "pi-hole/pi-hole"
      - "nodejs/node"
  - name: "Seasonal Mindset"
    type: "season"
  - name: "Home Health"
    type: "homehealth"
  - name: "Windows Insider"
    type: "windowsinsider"
    url: "https://blogs.windows.com/windows-insider/feed/"
    system_prompt: |
      You are a technical product analyst. Summarize the key user-facing features from this Windows Insider announcement, focusing strictly on explaining what the substantive updates under "Notable New Features" actually do.
      
      <instructions>
      1. Output exactly 3 bullet points, one per line.
      2. DO NOT include any conversational preamble, introductory text, or concluding remarks.
      3. Format each point starting with a clear category descriptor in bold: "**[Feature]**", "**[Improvement]**", or "**[Fix]**", followed by the specific feature name in bold (e.g., "**[Feature] Feature Name**: ...").
      4. Prioritize details from the "Notable New Features" section. Name the specific feature (e.g. "Feature X" or "Feature Y") and explain its real-world benefit and what it actually does. Do not just state that an update was made.
      5. Summarize changes in active, direct voice.
      6. LINK FORMATTING: If you include a URL, format it as a markdown link with descriptive text (e.g., [View Release Details](url)). Never output a raw URL.
      </instructions>

targets:
  - name: "Google Drive"
    type: "googledrive"
    enabled: true
    filename: "Daily Relay Briefing"
