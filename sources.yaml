sources:
  - name: "Hacker News"
    type: "hackernews"
    url: "https://hacker-news.firebaseio.com/v0/topstories.json"
    limit: 10
  - name: "Ubuntu Security Notices"
    type: "rss"
    url: "https://ubuntu.com/security/notices/rss.xml"
    limit: 5
  - name: "Gmail Updates"
    type: "imap"
    host: "imap.gmail.com"
    port: 993
    tls: true
    tlsOptions:
      rejectUnauthorized: false
    user_env: "IMAP_USER"
    pass_env: "IMAP_PASS"
    folder: "INBOX"
    gmail_raw: "category:updates newer_than:1d"
    limit: 10
