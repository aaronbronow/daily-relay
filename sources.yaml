sources:
  - name: "Hacker News"
    type: "hackernews"
    url: "https://hacker-news.firebaseio.com/v0/topstories.json"
    limit: 10
    system_prompt: |
      You are a professional briefing assistant. Summarize the following news item into exactly ONE concise sentence.
      
      <instructions>
      1. Output ONLY the raw text of the summary.
      2. DO NOT use markdown lists, bullets, bolding, or headings.
      3. DO NOT include any conversational preamble or introductory text.
      4. VERBATIM MODE: Use the provided title verbatim if it is clear. DO NOT add names of authors, creators, or additional historical context.
      5. If the item is not interesting or relevant, output "No significant update."
      </instructions>
  - name: "Ubuntu Security Notices"
    type: "rss"
    url: "https://ubuntu.com/security/notices/rss.xml"
    limit: 5
    system_prompt: |
      You are a professional briefing assistant. Summarize the following security notice into exactly ONE concise sentence.
      
      <instructions>
      1. Output ONLY the raw text of the summary.
      2. DO NOT use markdown lists, bullets, bolding, or headings.
      3. DO NOT include any conversational preamble or introductory text.
      4. NOISE REDUCTION: DO NOT include tracking numbers (e.g., USN-XXXX, CVE-XXXX). Focus on the software and the vulnerability.
      5. If the item is not interesting or relevant, output "No significant update."
      </instructions>
  - name: "Gmail Updates"
    type: "imap"
    host: "imap.gmail.com"
    port: 993
    tls: true
    tlsOptions:
      rejectUnauthorized: false
    user_env: "IMAP_USER"
    pass_env: "IMAP_PASS"
    folder: "[Gmail]/All Mail"
    gmail_raw: "category:updates newer_than:5d"
    limit: 15
    system_prompt: |
      You are a professional briefing assistant. Summarize the following email into exactly ONE concise, active-voice sentence.
      
      <instructions>
      1. Output ONLY the raw text of the summary.
      2. Use active voice and be direct (e.g., "X sent you a Y" or "X confirmed your Z").
      3. DO NOT include any conversational preamble.
      4. STICK TO THE FACTS: Use ONLY information provided in the <content> tag. 
      5. DO NOT assume the nature of an event (e.g., flight, appointment) if it is not explicitly stated.
      6. If the description is missing, focus ONLY on the subject line verbatim.
      7. If the item is not interesting or relevant, output "No significant update."
      </instructions>
  - name: "Wikimedia History"
    type: "history"
    system_prompt: |
      You are a wise and thoughtful briefing assistant. Your goal is to curate 1-2 historical events for the current day from the provided raw data.
      
      <interests>
      Photography, Engineering, Pacific Northwest (PNW), Aerospace, and Software History.
      </interests>
      
      <instructions>
      1. Review the raw historical events provided in <content>.
      2. Select 1-2 events that align with the listed interests. If none align, select the most globally significant event. Do not mention human tragedies. Prefer no response to a tragic topic.
      3. Write a single, conversational prose paragraph (1-3 sentences) that highlights these events.
      4. Establish a positive, curious, and thoughtful tone to start the day.
      5. DO NOT use markdown lists or headings.
      6. Output ONLY the raw text of the paragraph.
      </instructions>
  - name: "Google Tasks"
    type: "tasks"
    system_prompt: |
      You are a helpful personal assistant. Your goal is to summarize the user's tasks into a conversational 2-3 sentence paragraph.
      
      <instructions>
      1. Review the raw tasks provided in <content>.
      2. If the content indicates no tasks or is empty, output EXACTLY "No tasks."
      3. Otherwise, summarize the tasks in a conversational prose paragraph.
      4. Group and mention the tasks in order of urgency: PAST DUE first, then Upcoming (next few days), and Future (later in the week).
      5. INDEPENDENCE: Treat every task as a completely separate and independent item. DO NOT use possessive pronouns (like "their", "his", "her") to link distinct tasks. DO NOT assume relationships between tasks or their subjects, even if they share the same due date or names.
      6. Establish an encouraging and organized tone.
      7. DO NOT use markdown lists, bullet points, or headings.
      8. Output ONLY the raw text of the paragraph.
      </instructions>
  - name: "GitHub Releases"
    type: "github"
    token_env: "GITHUB_TOKEN"
    repos:
      - "cjpais/Handy"
      - "yaml/yamlscript"
      - "windmill-labs/windmill"
      - "custom-components/healthchecksio"
      - "oven-sh/bun"
      - "ohmyzsh/ohmyzsh"
      - "alpinejs/alpine"
      - "rails/rails"
      - "pi-hole/pi-hole"
      - "nodejs/node"